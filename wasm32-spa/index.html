<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UPLC Browser CEK</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #17202a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.4vw, 2.4rem);
        font-weight: 720;
      }

      .status {
        min-height: 24px;
        font-size: 0.95rem;
        color: #4f5c69;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.85fr);
        gap: 16px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d8dee6;
        border-radius: 8px;
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 52px;
        padding: 12px 14px;
        border-bottom: 1px solid #d8dee6;
      }

      label,
      .panel-title {
        font-size: 0.92rem;
        font-weight: 650;
      }

      textarea,
      pre {
        width: 100%;
        min-height: 420px;
        margin: 0;
        padding: 16px;
        border: 0;
        outline: 0;
        resize: vertical;
        font: 0.94rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;
        background: #fbfcfe;
        color: #111827;
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #26313d;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: #146c94;
      }

      button {
        min-width: 116px;
        height: 38px;
        border: 1px solid #0f5e82;
        border-radius: 6px;
        background: #146c94;
        color: #ffffff;
        font-weight: 680;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      .stderr {
        color: #8a1f11;
      }

      @media (max-width: 820px) {
        main {
          width: min(100vw - 20px, 720px);
          padding: 18px 0;
        }

        header,
        .panel-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        textarea,
        pre {
          min-height: 300px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>UPLC Browser CEK</h1>
          <div id="status" class="status">Ready</div>
        </div>
        <div class="controls">
          <label class="checkbox">
            <input id="budget" type="checkbox" />
            show budget (-c)
          </label>
          <button id="evaluate" type="button">Evaluate</button>
        </div>
      </header>

      <section class="workspace" aria-label="UPLC evaluator">
        <div class="panel">
          <div class="panel-header">
            <label for="program">UPLC program</label>
          </div>
          <textarea id="program" spellcheck="false">(program 1.0.0 [ [ (builtin addInteger) (con integer 40) ] (con integer 2) ])</textarea>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Output</div>
          </div>
          <pre id="output" aria-live="polite"></pre>
        </div>
      </section>
    </main>
    <script src="./bootstrap.js"></script>
  </body>
</html>
