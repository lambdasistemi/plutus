name: "🕸️ Wasm32 SPA — GitHub Pages"

# Build the browser uplc evaluator SPA and deploy it to GitHub Pages.
# Requires Pages enabled with source "GitHub Actions" and the github-pages
# environment allowing the wasm32-* branch.

on:
  push:
    branches:
      - 'wasm32-**'
    paths:
      - 'wasm32-spa/**'
      - 'nix/**'
      - 'cabal-wasm-uplc.project'
      - '.github/workflows/wasm32-spa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wasm32-spa-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: nixos
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the SPA (uplc.wasm + esbuild bundle)
        run: |
          nix shell --accept-flake-config nixpkgs#nodejs --command bash -euo pipefail -c '
            cd wasm32-spa
            npm ci --no-audit --no-fund
            npm run build
          '

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -rL wasm32-spa/dist/* _site/
          touch _site/.nojekyll
          chmod -R u+w _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
